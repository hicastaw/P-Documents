services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdocs}
      POSTGRES_USER: ${POSTGRES_USER:-pdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdocs_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pdocs_net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [pdocs_net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [pdocs_net]

  minio_proxy:
    image: nginx:1.26-alpine
    depends_on:
      - minio
    ports:
      - "9000:9000"
    volumes:
      - ./infra/minio-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [pdocs_net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [pdocs_net]

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      API_PORT: ${API_PORT:-3000}
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8888/minio}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      # Ensure JWT secrets are injected (env_file parsing may fail in some setups).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: /bin/sh -lc "npm install --no-audit --no-fund && npm run dev"
    networks: [pdocs_net]

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - /app/node_modules
    command: /bin/sh -lc "npm install --no-audit --no-fund && npm run dev"
    networks: [pdocs_net]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: /api
      PORT: 3001
    depends_on:
      api:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: /bin/sh -lc "npm install --no-audit --no-fund && npm run dev"
    networks: [pdocs_net]

  nginx:
    image: nginx:1.26-alpine
    depends_on:
      - client
      - api
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [pdocs_net]

networks:
  pdocs_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

