[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:node]
directory=/app
; Mount or bake your Node app into /app.
; Default: npm start (expects package.json). Override at runtime if needed.
command=/bin/sh -lc "if [ -f package.json ]; then npm install --omit=dev --no-audit --no-fund && npm run start; else node -e 'console.error(\"No /app/package.json found. Mount your Node app into /app.\"); process.exit(1)'; fi"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

