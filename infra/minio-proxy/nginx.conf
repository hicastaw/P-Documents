server {
  listen 9000;
  server_name _;

  # No body size limit — MinIO handles its own limits
  client_max_body_size 0;

  # Disable request buffering so large files stream directly to MinIO
  proxy_request_buffering off;

  # Extended timeouts for large file uploads
  proxy_connect_timeout 600s;
  proxy_send_timeout    600s;
  proxy_read_timeout    600s;
  send_timeout          600s;

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, PUT, POST, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-date, x-amz-content-sha256, x-amz-security-token, x-amz-user-agent" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, PUT, POST, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-date, x-amz-content-sha256, x-amz-security-token, x-amz-user-agent" always;
    add_header Access-Control-Expose-Headers "ETag, x-amz-request-id" always;

    proxy_pass http://minio:9000;
    proxy_http_version 1.1;

    # Preserve original signature host expected by presigned URL
    proxy_set_header Host "minio:9000";

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
