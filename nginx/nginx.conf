map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # No size limit — MinIO handles it on the minio-proxy side
  client_max_body_size 0;

  # Disable buffering for large file uploads / presigned PUTs
  proxy_request_buffering off;
  proxy_buffering off;

  # Extended timeouts for large uploads
  proxy_connect_timeout 600s;
  proxy_send_timeout    600s;
  proxy_read_timeout    600s;
  send_timeout          600s;

  server_tokens off;
  resolver 127.0.0.11 ipv6=off valid=5s;

  # Client (Next.js)
  location / {
    set $client_upstream http://client:3001;
    proxy_pass $client_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js dev HMR websocket
  location /_next/webpack-hmr {
    set $client_upstream http://client:3001;
    proxy_pass $client_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # API
  location /api/ {
    set $api_upstream http://api:3000;
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Socket.io (default path)
  location /socket.io/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # MinIO via same-origin path — stream directly, no buffering
  # CRITICAL: Use rewrite ^/minio(/.*)$ (no trailing ?) to strip prefix and
  # pass the rest INCLUDING query string (?X-Amz-...) to minio_proxy unchanged.
  # Using 'break' means nginx stops processing rewrites and passes the URI as-is
  # (with query string preserved) — no double-encoding occurs.
  location /minio/ {
    rewrite ^/minio(/.*)$ $1 break;
    proxy_pass http://minio_proxy:9000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    # Do NOT set Host to $host — minio_proxy sets it to minio:9000
    # which matches the presigned URL signature
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
